server {
    listen 443 ssl;
    server_name teityura.com;

    # Short URL redirects
    location = /asgore    { return 302 https://www.youtube.com/watch?v=pSdOZuiZlXI; }
    location = /mipha     { return 302 https://www.youtube.com/watch?v=sHOggfViH8s; }
    location = /minecraft { return 302 https://www.scribd.com/document/1007028027/mc-docker; }

    # WordPress server
    location / {
        proxy_pass http://host.docker.internal:8080/;
        proxy_redirect http:// https://;

        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Host $host;

        client_max_body_size 512m;
    }
}
