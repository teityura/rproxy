server {
    listen 443 ssl;
    server_name gnos.teityura.com;

    location / {
        proxy_pass http://gnos-site.s3-website-ap-northeast-1.amazonaws.com/;
        proxy_set_header Host gnos-site.s3-website-ap-northeast-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
